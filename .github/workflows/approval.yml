name: Drift Resolver — PR Approval Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  drift-approval:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r drift_resolver/requirements.txt

      - name: Wait for PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          echo "Waiting for PostgreSQL..."
          for i in {1..15}; do
            PGPASSWORD=testpass psql -h localhost -U testuser \
              -d testdb -c 'SELECT 1;' && \
              echo "PostgreSQL ready." && break
            echo "Attempt $i failed. Retrying..."
            sleep 3
          done

      - name: Apply baseline migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb

      - name: Simulate safe drift
        run: |
          echo "Schema has nullable bio; baseline DB does not."
          echo "Diff will propose ADD COLUMN bio (SAFE)."
          echo "Do not ADD bio to the DB — that would remove the drift."
          PGPASSWORD=testpass psql -h localhost -U testuser -d testdb \
            -c '\d "User"'

      - name: Run drift-resolver with approval gate
        run: |
          python drift_resolver/main.py \
            --schema ./prisma/schema.prisma \
            --db-url "postgresql://testuser:testpass@localhost:5432/testdb"
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          AUTO_APPROVE: 'false'
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_PASSWORD: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_REPO_URL: ${{ github.server_url }}/${{ github.repository }}

      - name: Confirm drift resolved (only runs if approved)
        if: success()
        run: |
          npx prisma migrate status
          PGPASSWORD=testpass psql -h localhost -U testuser -d testdb \
            -c '\d "User"'
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-pr-${{ github.event.pull_request.number }}-run-${{ github.run_number }}
          path: |
            drift-report.json
            drift-report.html
          if-no-files-found: warn

      - name: Clean up drift migrations
        if: always()
        run: rm -rf prisma/migrations/*_drift_auto_resolve
